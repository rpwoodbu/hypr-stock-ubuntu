
# Overall config docs: https://wiki.hypr.land/Configuring/


# See https://wiki.hypr.land/Configuring/Monitors/
monitor=HDMI-A-1,2560x1440@59.95,0x0,1
monitor=DVI-D-1,2560x1440@59.95,2560x0,1

# See https://wiki.hypr.land/Configuring/Keywords/
$terminal = foot
$fileManager = nautilus
$menu = wofi --show drun --allow-images --insensitive


# WARNING: It's tempting to use Universal Wayland Session Manager (uwsm) to
# manage many of the systems we're starting with `exec-once` statements. But
# It's probably best to avoid uwsm on a system that's also meant to make a
# Gnome desktop environment available. uwsm will set up global systemd units
# which expect a hyprland compositor instead of Gnome's compositor. This will
# result in error message popping up on the display in Gnome without further
# complexity injected into the systemd unit configurations.

# WARNINGS: New exec-once statements which call systemctl usually require
# a corresponding addition in ~/.local/bin/hyprland-logout.

# status bar
exec-once = waybar
# wallpaper/background manager
#exec-once = hyprpaper
# handles user idle timers (e.g. dim, lock, suspend)
exec-once = hypridle
# on-screen display server (e.g. volume, brightness)
exec-once = systemctl --user start swayosd-server
# load the most recent nightlight mode
exec-once = ~/.local/bin/nightlightctl restore
# start the polkit agent (authn pop-ups)
exec-once = systemctl --user start hyprpolkitagent
# record copied text (not images) to clipboard history; images are not
# displayed with wofi menus
exec-once = wl-paste --type text --watch cliphist store

# See https://wiki.hypr.land/Configuring/Environment-variables/
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# See https://wiki.hypr.land/Configuring/Variables/
# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 0
    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#group
group {
    # Window border colors for grouped windows (defaults to yellow)
    # For now, reuse the default border colors.
    col.border_active = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.border_inactive = rgba(595959aa)

    # https://wiki.hypr.land/Configuring/Variables/#groupbar
    groupbar {
        enabled = true
        height = 26
        # `gradients` must be true for the groupbar background not to be
        # translucent.
        gradients = true
        col.active = rgba(333333ff)
        col.inactive = rgba(111111ff)

        # Hyprland defaults font_size to 8, which makes titles difficult to read
        # on high DPI displays.
        font_size = 14
        font_weight_active = bold
        text_color = rgba(ffffffff)
        text_color_inactive = rgba(bbbbbbff)

        # Indicator stripe beneath the title.
        indicator_height = 0
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}


# https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    # Master switch for pseudotiling. Enabling is bound to mainMod + P in the
    # keybinds section below.
    pseudotile = true
    preserve_split = true # You probably want this.
}

# https://wiki.hypr.land/Configuring/Master-Layout/
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    # Which of the three (0, 1, 2) included wallpapers to use.
    force_default_wallpaper = 0
    # Disables the built-in wallpaper. I'm using hyprpaper.
    disable_hyprland_logo = true
    # Disables text quotes at the bottom of the wallpaper.
    disable_splash_rendering = true
}

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:super,shift:both_capslock
    kb_rules =

    repeat_delay = 250
    repeat_rate = 35

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

cursor {
    hide_on_key_press = true
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# See https://wiki.hypr.land/Configuring/Keywords/
# The goal with these bindings is it mimic Omarchy's bindings as I might end up
# running Omarchy in the future and I still boot it from USB occasionally.
$mainMod = SUPER # Sets "Windows" key as main modifier

# Applications, operations, and menus
bindd = $mainMod, Return, Terminal, exec, $terminal
bindd = $mainMod SHIFT, Return, Web browser, exec, x-www-browser
# TODO(jpwoodbu): Write a script that will pass the correct flag based on the
# current default browser.
# If you use Firefox change the flag to --private-window.
bindd = $mainMod SHIFT ALT, B, Web browser (incognito), exec, x-www-browser --incognito
bindd = $mainMod SHIFT, F, File manager, exec, $fileManager --new-window
bindd = $mainMod, SPACE, Application menu, exec, $menu
bindd = $mainMod, Escape, System menu, exec, ~/.local/bin/system-menu
bindd = $mainMod, K, Show keybindings, exec, ~/.local/bin/hyprland-keybinds
bindd = $mainMod, L, Lock screen, exec, pidof hyprlock || hyprlock
bindd = $mainMod SHIFT, L, Lock and Suspend, exec, systemctl suspend
bindd = $mainMod, Print, Color picker, exec, hyprpicker -a
bindd = , Print, Screenshot region, exec, grim -g "$(slurp)" - | wl-copy && swayosd-client --custom-message "Captured to clipboard"
bindd = $mainMod CTRL, V, Clipboard history, exec, cliphist list | wofi --dmenu -p "Search clipboard history" | cliphist decode | wl-copy -n

# Window Controls
bindd = $mainMod, W, Close active window, killactive,
bindd = $mainMod, T, Toggle floating, togglefloating,
bindd = $mainMod, O, Pop out window, exec, ~/.local/bin/hyprland-window-pop
bindd = $mainMod, F, Toggle fullscreen, fullscreen, 0
bindd = $mainMod ALT, F, Toggle maximize, fullscreen, 1
bindd = $mainMod CTRL, F, Toggle full screen inside window, fullscreenstate, 0 2
bindd = $mainMod, J, Toggle split, togglesplit, # dwindle
bindd = $mainMod, P, Toggle pseudo, pseudo, # dwindle

# Window Switching
bindd = ALT, Tab, Focus next window, cyclenext, visible
bind = ALT, Tab, bringactivetotop,
bindd = ALT SHIFT, Tab, Focus previous window, cyclenext, visible prev
bind = ALT SHIFT, Tab, bringactivetotop,

# Window Swapping
bindd = $mainMod SHIFT, left, Swap window to the left, swapwindow, l
bindd = $mainMod SHIFT, right, Swap window to the right, swapwindow, r
bindd = $mainMod SHIFT, up, Swap window up, swapwindow, u
bindd = $mainMod SHIFT, down, Swap window down, swapwindow, d

# Window Grouping
bindd = $mainMod, G, Toggle window grouping, togglegroup
bindd = $mainMod ALT, G, Move active window out of group, moveoutofgroup
bindd = $mainMod ALT, left, Move window to group on left, moveintogroup, l
bindd = $mainMod ALT, right, Move window to group on right, moveintogroup, r
bindd = $mainMod ALT, up, Move window to group on top, moveintogroup, u
bindd = $mainMod ALT, down, Move window to group on bottom, moveintogroup, b
bindd = $mainMod ALT, Tab, Next window in group, changegroupactive, f
bindd = $mainMod ALT SHIFT, Tab, Previous window in group, changegroupactive, b
bindd = $mainMod ALT, mouse_down, Next window in group, changegroupactive, f
bindd = $mainMod ALT, mouse_up, Previous window in group, changegroupactive, b
bindd = $mainMod ALT, 1, Switch to group window 1, changegroupactive, 1
bindd = $mainMod ALT, 2, Switch to group window 2, changegroupactive, 2
bindd = $mainMod ALT, 3, Switch to group window 3, changegroupactive, 3
bindd = $mainMod ALT, 4, Switch to group window 4, changegroupactive, 4
bindd = $mainMod ALT, 5, Switch to group window 5, changegroupactive, 5
bindd = $mainMod ALT, 6, Switch to group window 6, changegroupactive, 6
bindd = $mainMod ALT, 7, Switch to group window 7, changegroupactive, 7
bindd = $mainMod ALT, 8, Switch to group window 8, changegroupactive, 8
bindd = $mainMod ALT, 9, Switch to group window 9, changegroupactive, 9
bindd = $mainMod ALT, 0, Switch to group window 10, changegroupactive, 10
# The following is not from Omarchy.
bindd = $mainMod ALT, page_up, Move window in group to the left, movegroupwindow, b
bindd = $mainMod ALT, page_down, Move window in group to the right, movegroupwindow, f

# Border & Aesthetic Toggles
bindd = $mainMod SHIFT, BackSpace, Toggle borders and gaps, exec, hyprctl getoption general:border_size | grep -q "int: 0" && hyprctl --batch "keyword general:border_size 2; keyword general:gaps_in 2; keyword general:gaps_out 0; keyword decoration:rounding 10" || hyprctl --batch "keyword general:border_size 0; keyword general:gaps_in 0; keyword general:gaps_out 0; keyword decoration:rounding 0"
# SIGUSR1 toggles its visibility
bindd = $mainMod SHIFT, SPACE, Toggle Waybar, exec, killall -SIGUSR1 waybar
bindd = $mainMod SHIFT, N, Toggle nightlight, exec, ~/.local/bin/nightlightctl
# Screen zoom
bindd = $mainMod CTRL, Z, Zoom in on cursor, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = $mainMod CTRL ALT, Z, Reset zoom, exec, hyprctl -q keyword cursor:zoom_factor 1

# Move focus with mainMod + arrow keys
bindd = $mainMod, left, Move focus left, movefocus, l
bindd = $mainMod, right, Move focus right, movefocus, r
bindd = $mainMod, up, Move focus up, movefocus, u
bindd = $mainMod, down, Move focus down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, 1, Workspace 1, workspace, 1
bindd = $mainMod, 2, Workspace 2, workspace, 2
bindd = $mainMod, 3, Workspace 3, workspace, 3
bindd = $mainMod, 4, Workspace 4, workspace, 4
bindd = $mainMod, 5, Workspace 5, workspace, 5
bindd = $mainMod, 6, Workspace 6, workspace, 6
bindd = $mainMod, 7, Workspace 7, workspace, 7
bindd = $mainMod, 8, Workspace 8, workspace, 8
bindd = $mainMod, 9, Workspace 9, workspace, 9
bindd = $mainMod, 0, Workspace 10, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindd = $mainMod SHIFT, 1, Move to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move to workspace 10, movetoworkspace, 10

# Move active window silently to a workspace with mainMod + SHIFT + ALT + [0-9].
bindd = $mainMod SHIFT ALT, 1, Move silently to workspace 1, movetoworkspacesilent, 1
bindd = $mainMod SHIFT ALT, 2, Move silently to workspace 2, movetoworkspacesilent, 2
bindd = $mainMod SHIFT ALT, 3, Move silently to workspace 3, movetoworkspacesilent, 3
bindd = $mainMod SHIFT ALT, 4, Move silently to workspace 4, movetoworkspacesilent, 4
bindd = $mainMod SHIFT ALT, 5, Move silently to workspace 5, movetoworkspacesilent, 5
bindd = $mainMod SHIFT ALT, 6, Move silently to workspace 6, movetoworkspacesilent, 6
bindd = $mainMod SHIFT ALT, 7, Move silently to workspace 7, movetoworkspacesilent, 7
bindd = $mainMod SHIFT ALT, 8, Move silently to workspace 8, movetoworkspacesilent, 8
bindd = $mainMod SHIFT ALT, 9, Move silently to workspace 9, movetoworkspacesilent, 9
bindd = $mainMod SHIFT ALT, 0, Move silently to workspace 10, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bindd = $mainMod, S, Toggle scratchpad, togglespecialworkspace, magic
bindd = $mainMod SHIFT, S, Move to scratchpad, movetoworkspace, special:magic

# Navigate workspaces with mainMod + Tab.
bindd = $mainMod, Tab, Next workspace, workspace, e+1
bindd = $mainMod SHIFT, Tab, Previous workspace, workspace, e-1
bindd = $mainMod CTRL, Tab, Former workspace, workspace, previous

# Scroll through existing workspaces with mainMod + scroll
bindd = $mainMod, mouse_down, Next workspace, workspace, e+1
bindd = $mainMod, mouse_up, Previous workspace, workspace, e-1

# Resize active window using the keyboard
binded = $mainMod, minus, Expand window left, resizeactive, -100 0
binded = $mainMod, equal, Shrink window right, resizeactive, 100 0
binded = $mainMod SHIFT, minus, Shrink window up, resizeactive, 0 -100
binded = $mainMod SHIFT, equal, Expand window down, resizeactive, 0 100
bindd = $mainMod ALT, BackSpace, Reset window split, splitratio, exact 1.0

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = $mainMod, mouse:272, Move window, movewindow
bindmd = $mainMod, mouse:273, Resize window, resizewindow

# Laptop multimedia keys
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, swayosd-client --output-volume raise --max-volume 100
bindeld = ,XF86AudioLowerVolume, Volume down, exec, swayosd-client --output-volume lower --max-volume 100
bindeld = ,XF86AudioMute, Mute audio, exec, swayosd-client --output-volume mute-toggle
bindeld = ,XF86AudioMicMute, Mute mic, exec, swayosd-client --input-volume mute-toggle
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, swayosd-client --brightness raise
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, swayosd-client --brightness lower
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPause, Play/Pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, Play/Pause, exec, playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

# https://wiki.hypr.land/Configuring/Window-Rules/
# https://wiki.hypr.land/Configuring/Workspace-Rules/
windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}
