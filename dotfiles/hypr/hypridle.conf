general {
    # Avoid starting multiple hyprlock instances.
    lock_cmd = pidof hyprlock || hyprlock
    # Lock before suspend. Turn off the screen before locking to avoid a janky
    # display of the lock screen right before the system is suspended.
    before_sleep_cmd = hyprctl dispatch dpms off; loginctl lock-session
    # Turn the screen back on and re-apply the night light on wake. wlsunset
    # loses its gamma effect across suspend/DPMS, so it must be restored even
    # though the state file still indicates it is enabled.
    after_sleep_cmd = hyprctl dispatch dpms on; ~/.local/bin/nightlightctl restore
    # Wait for the session to be locked before releasing the systemd sleep
    # delay inhibitor. This should be the implicit default behavior based on
    # https://wiki.hypr.land/0.53.0/Hypr-Ecosystem/hypridle/#configuration, but
    # let's be explicit to avoid any privacy issues.
    inhibit_sleep = 3
}

# Dim the screen after 5 minutes.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock the screen after 5.5 minutes.
listener {
    timeout = 330
    on-timeout = loginctl lock-session
}

# Turn off the display after 6 minutes.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 10 min of inactivity.
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
